# Credencial de administracion de Grafana (Practica 10).
# Cifrada con la llave publica de Sealed Secrets de la Practica 9
# (P9/docs/sealed-secrets-cert.pem): solo el controlador del cluster puede
# descifrarla, de modo que publicarla en este repositorio es seguro.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: grafana-admin
  namespace: observabilidad
spec:
  encryptedData:
    clave: 
    usuario: 
  template:
    metadata:
      creationTimestamp: null
      name: grafana-admin
      namespace: observabilidad
    type: Opaque
