# ==============================================================================
# Loki — almacen de registros (Practica 10)
#
# Modo SingleBinary con sistema de archivos: un pod, un volumen. Suficiente
# para el volumen de este entorno y sin dependencias de almacen de objetos.
#
# Por que Loki y no Elasticsearch: Loki indexa solo las etiquetas (namespace,
# container, level) y no el contenido. Los registros son JSON, y los campos
# (trace_id, status_code, motivo) se consultan al leer con | json. Para buscar
# por trace_id eso basta, y cuesta una fraccion de la memoria.
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observabilidad-loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.16.0
    helm:
      releaseName: loki
      values: |
        fullnameOverride: loki
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          limits_config:
            retention_period: 168h
          compactor:
            retention_enabled: true
            delete_request_store: filesystem
        singleBinary:
          replicas: 1
          resources:
            requests: { cpu: 25m, memory: 192Mi }
            limits: { cpu: 500m, memory: 768Mi }
          persistence:
            enabled: true
            storageClass: managed-csi
            size: 5Gi
        read: { replicas: 0 }
        write: { replicas: 0 }
        backend: { replicas: 0 }
        gateway: { enabled: false }
        chunksCache: { enabled: false }
        resultsCache: { enabled: false }
        lokiCanary: { enabled: false }
        test: { enabled: false }
        monitoring:
          selfMonitoring: { enabled: false }
  destination:
    server: https://kubernetes.default.svc
    namespace: observabilidad
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
