# ==============================================================================
# Kyverno - motor de admision (Practica 8)
#
# Practica 9 - Maria Jose Tebalan Sanchez - 202100265
#
# Ola 0. ServerSideApply es obligatorio: los CRDs de Kyverno superan el limite
# de 256 KB de la anotacion last-applied-configuration del apply clasico.
# El namespace kyverno lo crea Terraform (platform/main.tf).
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  # El chart de Kyverno trae hooks post-delete; ArgoCD agrega estos dos
  # finalizers a la Application en vivo. Si no se declaran aqui, la aplicacion
  # raiz ve la diferencia y queda OutOfSync.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
    - post-delete-finalizer.argocd.argoproj.io
    - post-delete-finalizer.argocd.argoproj.io/cleanup
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.3.4
    helm:
      # Practica 9 - capacidad N+1: los cuatro controladores piden 100m cada
      # uno por defecto (400m) y consumen ~1m en reposo. Con 25m caben en un
      # solo nodo cuando el otro se drena.
      # Se usa "values" (texto) y no "valuesObject": dentro del app-of-apps,
      # ArgoCD normaliza valuesObject distinto de como esta en Git y la
      # aplicacion raiz queda OutOfSync de forma permanente.
      values: |
        admissionController:
          container:
            resources:
              requests: { cpu: 25m, memory: 128Mi }
        backgroundController:
          resources:
            requests: { cpu: 25m, memory: 64Mi }
        cleanupController:
          resources:
            requests: { cpu: 25m, memory: 64Mi }
        reportsController:
          resources:
            requests: { cpu: 25m, memory: 64Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
    retry:
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
